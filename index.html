<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mood chart">
<meta name="theme-color" content="#fcd873">
<title>Mood chart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Comic+Neue:wght@700&display=swap">
<style>
:root{--bg:#fcd873;--card:#fdf6e3;--fg:#4a3820;--muted:#76603a;--grid:#ecd9a8;--c:hsl(65 72% 48%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#fcd873}
*{box-sizing:border-box}
body{margin:0;background:#fcd873 linear-gradient(135deg,#fbdd7d,#fdc966) fixed;color:var(--fg);font-family:Nunito,system-ui,"Segoe UI",Roboto,sans-serif;font-weight:500;-webkit-tap-highlight-color:transparent}
main{position:relative;max-width:460px;margin:0 auto;padding:20px 20px 36px}
h1{font-family:"Comic Sans MS","Comic Sans","Comic Neue",cursive;font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:4px 0 0;text-align:center}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:2px 0 0}
#word{display:flex;align-items:center;justify-content:center;height:68px;width:calc(100% - 12px);margin:22px 6px 14px;padding:0 8px 3px;white-space:nowrap;font-size:min(38px,10vw);font-weight:800;border:3px solid var(--fg);border-radius:18px;color:var(--c);-webkit-text-stroke:2px var(--fg);paint-order:stroke fill;transition:color .2s}
.sl{padding:0 6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;border-radius:9px;margin:10px 0;outline:none;
background:linear-gradient(90deg,#000,#fff);box-shadow:0 0 0 2px var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:5px solid var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{background:transparent}
input[type=range]:focus-visible::-webkit-slider-thumb{outline:3px solid var(--fg)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.catwrap{display:flex;flex-direction:column;align-items:center;margin:20px 0 6px}
#cat{display:flex;justify-content:flex-end;align-items:flex-end;width:calc(100% - 12px);height:120px;margin:0 6px;border-radius:40px;border:0;background:#fbf4e2;box-shadow:0 10px 24px rgba(140,90,0,.3),inset 0 0 0 7px var(--fg);cursor:pointer;padding:0 8px 0 0;overflow:hidden;transition:box-shadow .2s}
#cat img{flex:none;width:auto;height:100%;aspect-ratio:1;display:block;pointer-events:none}
.clk{align-self:center;flex:1;text-align:center;font-family:"Comic Sans MS","Comic Sans","Comic Neue",cursive;font-weight:700;font-size:min(26px,6.6vw);white-space:nowrap;color:var(--fg);pointer-events:none}
#cat:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
#cat.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.86)}70%{transform:scale(1.07)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){#cat.pop{animation:none}}
#toast{min-height:22px;margin-top:10px;font-size:15px;font-weight:700;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin-top:2px}
.nick{display:flex;gap:8px;justify-content:center;margin:14px 0 0}.nick input{flex:1;max-width:240px;min-width:0;border:2px solid var(--grid);border-radius:14px;padding:10px 14px;font:inherit;font-weight:700;color:var(--fg);background:var(--card);outline:none}.nick input:focus{border-color:var(--fg)}.nick button{border:0;border-radius:14px;padding:10px 16px;font:inherit;font-weight:800;background:var(--fg);color:#fdf6e3;cursor:pointer}.hi{text-align:center;font-size:18px;font-weight:800;margin:14px 0 0}.chg{border:0;background:none;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-left:8px}
.add{position:absolute;top:16px;right:14px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(74,56,32,.12);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.add:focus-visible{outline:2px solid var(--fg)}.add svg{width:18px;height:18px}.addinfo{position:absolute;top:56px;right:14px;left:14px;z-index:5;text-align:center;font-size:14px;line-height:1.4;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 6px 18px rgba(120,80,0,.25)}.add[hidden],.addinfo[hidden]{display:none}
.btn2{display:block;margin:0 auto;border:0;border-radius:14px;padding:10px 18px;font:inherit;font-weight:800;background:var(--fg);color:#fdf6e3;cursor:pointer}
.btn2:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.note{font-size:14px;color:var(--muted);margin:-2px 2px 12px}
.fta{width:100%;height:84px;margin-top:10px;border:2px solid var(--grid);border-radius:12px;padding:8px;font:inherit;font-size:12px;background:var(--card);color:var(--fg);word-break:break-all;resize:none}
.fmsg{font-size:14px;color:var(--muted);text-align:center;min-height:20px;margin-top:8px}
.fr{background:var(--card);border:3px solid var(--fg);border-radius:18px;padding:10px 12px 6px;margin-top:10px}
.frh{display:flex;align-items:center;gap:10px}
.frh b{font-weight:800}
.frh span{flex:1;color:var(--muted);font-size:14px}
.frh button{border:0;background:none;color:var(--muted);font-size:18px;padding:6px 10px;cursor:pointer;border-radius:8px}
.frh button:focus-visible{outline:2px solid var(--fg)}
h2{font-size:17px;font-weight:800;margin:26px 0 10px}
.card{background:var(--card);border:3px solid var(--fg);border-radius:18px;padding:12px 8px 8px}
svg.ch{width:100%;height:auto;display:block}
.stat{font-size:14px;color:var(--muted);margin:10px 4px 0}
.row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--grid)}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--fg);flex:none}
.row b{font-weight:700}
.row span{color:var(--muted);font-size:14px;flex:1}
.row button{border:0;background:none;color:var(--muted);font-size:18px;padding:6px 10px;cursor:pointer;border-radius:8px}
.row button:focus-visible{outline:2px solid var(--fg)}
.empty{color:var(--muted);font-size:14px;padding:8px 4px}
</style>
</head>

<main>

<form class="nick" id="ff"><input id="fcode" placeholder="Код друга" autocomplete="off" aria-label="Код друга"><button type="submit">Добавить</button></form>
<div id="fmsg" class="fmsg" aria-live="polite"></div>
<div id="friends"></div>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var KEY="murr.entries", entries=[];
try{entries=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){entries=[]}
if(!Array.isArray(entries))entries=[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}
function col(v){return "hsl(0 0% "+Math.round(v)+"%)"}
function lab(v){return v<=16?"Ужасно":v<=33?"Плохо":v<=50?"Так себе":v<=67?"Нормально":v<=84?"Хорошо":"Отлично"}
function hm(t){return new Date(t).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit"})}
function dayStart(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
var DAY=864e5;

var val=+$("mood").value;
function setVal(v){
  val=v;
  var r=document.documentElement.style;
  r.setProperty("--c",col(v));
  $("word").textContent=lab(v);
}
$("mood").addEventListener("input",function(e){setVal(+e.target.value)});

var tt;
$("cat").addEventListener("click",function(){
  var now=Date.now();
  entries.push({t:now,v:val});
  save();
  var b=$("cat");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");
  $("toast").textContent="Записано: "+lab(val).toLowerCase()+", "+hm(now);
  clearTimeout(tt);tt=setTimeout(function(){$("toast").textContent=""},3000);
  render();
});

function drawChart(){
  var W=340,H=190,L=34,R=8,T=10,B=26,w=W-L-R,h=H-T-B;
  var end=dayStart(Date.now())+DAY,start=end-7*DAY;
  var pts=entries.filter(function(e){return e.t>=start&&e.t<end}).sort(function(a,b){return a.t-b.t});
  var X=function(t){return L+(t-start)/(end-start)*w},Y=function(v){return T+(100-v)/100*h};
  var s='<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient></defs>';
  s+='<rect x="'+(L-16)+'" y="'+T+'" width="7" height="'+h+'" rx="3.5" fill="url(#g)" stroke="var(--fg)" stroke-width="1"/>';
  [25,50,75].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--grid)" stroke-dasharray="3 4"/>'});
  for(var i=0;i<=7;i++){var x=X(start+i*DAY);s+='<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+h)+'" stroke="var(--grid)"/>'}
  for(i=0;i<7;i++){
    var d=new Date(start+i*DAY+12*36e5);
    s+='<text x="'+X(start+i*DAY+DAY/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" font-weight="'+(i===6?800:500)+'" fill="'+(i===6?'var(--fg)':'var(--muted)')+'">'+d.toLocaleDateString("ru",{weekday:"short"})+'</text>';
  }
  if(!pts.length){s+='<text x="'+(W/2)+'" y="'+(T+h/2)+'" text-anchor="middle" font-size="13" fill="var(--muted)">Здесь появится график</text>'}
  else{
    if(pts.length>1)s+='<polyline fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)}).join(" ")+'"/>';
    pts.forEach(function(p){s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="5" fill="'+col(p.v)+'" stroke="var(--fg)" stroke-width="1.5"/>'});
  }
  $("chart").innerHTML=s;
  if(pts.length){
    var avg=Math.round(pts.reduce(function(a,p){return a+p.v},0)/pts.length);
    $("stat").textContent="Записей за неделю: "+pts.length+". В среднем: "+lab(avg).toLowerCase()+".";
  }else $("stat").textContent="";
}

function dayName(t){
  var d=dayStart(Date.now())-dayStart(t);
  if(d===0)return"сегодня";if(d===DAY)return"вчера";
  return new Date(t).toLocaleDateString("ru",{weekday:"short",day:"numeric",month:"short"});
}
function drawList(){
  var box=$("list");box.innerHTML="";
  var last=entries.slice().sort(function(a,b){return b.t-a.t}).slice(0,8);
  if(!last.length){box.innerHTML='<div class="empty">Пока пусто. Подвинь полоску и нажми на котика.</div>';return}
  last.forEach(function(e){
    var r=document.createElement("div");r.className="row";
    r.innerHTML='<i class="dot" style="background:'+col(e.v)+'"></i><b>'+lab(e.v)+'</b><span>'+dayName(e.t)+', '+hm(e.t)+'</span>';
    var x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Удалить запись");
    x.addEventListener("click",function(){entries=entries.filter(function(q){return q.t!==e.t});save();render()});
    r.appendChild(x);box.appendChild(r);
  });
}
function render(){drawChart();drawList()}

setVal(val);render();

// nickname, kept on this phone only
var NK="murr.nick",nick="";
try{nick=localStorage.getItem(NK)||""}catch(e){}
function drawNick(edit){
  var b=$("nickbox");b.innerHTML="";
  if(nick&&!edit){
    var d=document.createElement("div");d.className="hi";
    d.appendChild(document.createTextNode("Привет, "+nick+"!"));
    var c=document.createElement("button");c.type="button";c.className="chg";c.textContent="сменить имя";
    c.addEventListener("click",function(){drawNick(true)});
    d.appendChild(c);b.appendChild(d);
  }else{
    var f=document.createElement("form");f.className="nick";
    f.innerHTML='<input maxlength="20" placeholder="Твой никнейм" autocomplete="nickname" aria-label="Никнейм"><button type="submit">Сохранить</button>';
    var i=f.firstChild;i.value=nick;
    f.addEventListener("submit",function(ev){ev.preventDefault();var v=i.value.trim().slice(0,20);if(!v){i.focus();return}nick=v;try{localStorage.setItem(NK,v)}catch(x){}drawNick()});
    b.appendChild(f);if(edit)i.focus();
  }
}
drawNick();

// «add to home screen» button
var dp=null,btn=$("add"),info=$("addinfo");
var standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
if(standalone)btn.hidden=true;
window.addEventListener("beforeinstallprompt",function(ev){ev.preventDefault();dp=ev});
window.addEventListener("appinstalled",function(){btn.hidden=true;info.hidden=true});
btn.addEventListener("click",function(){
  if(dp){dp.prompt();dp=null;return}
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  info.textContent=ios?"На iPhone: открой эту страницу в Safari, нажми «Поделиться» (квадрат со стрелкой) и выбери «На экран Домой».":"На Android: нажми меню браузера ⋮ и выбери «Добавить на главный экран» или «Установить приложение».";
  info.hidden=false;
});
info.addEventListener("click",function(){info.hidden=true});

// friends: share a code, paste a friend's code
var FK="murr.friends",friends=[];
try{friends=JSON.parse(localStorage.getItem(FK)||"[]")}catch(e){friends=[]}
if(!Array.isArray(friends))friends=[];
function saveF(){try{localStorage.setItem(FK,JSON.stringify(friends))}catch(e){}}
function b64e(s){var by=new TextEncoder().encode(s),r="";by.forEach(function(x){r+=String.fromCharCode(x)});return btoa(r)}
function b64d(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return new TextDecoder().decode(a)}
function weekPts(list){var end=dayStart(Date.now())+DAY,st=end-7*DAY;return list.filter(function(p){return p.t>=st&&p.t<end}).sort(function(a,b){return a.t-b.t})}
function makeCode(){
  var e=weekPts(entries).slice(-50).map(function(p){return[Math.round(p.t/6e4),p.v]});
  return "MURR1:"+b64e(JSON.stringify({n:nick,e:e}));
}
function parseCode(s){
  try{
    var o=JSON.parse(b64d(s));
    if(!o||typeof o.n!=="string"||!Array.isArray(o.e))return null;
    var n=o.n.trim().slice(0,20);if(!n)return null;
    var e=[];
    o.e.slice(0,200).forEach(function(p){
      if(Array.isArray(p)&&isFinite(p[0])&&isFinite(p[1]))e.push({t:Math.round(+p[0])*6e4,v:Math.max(0,Math.min(100,Math.round(+p[1])))});
    });
    return{n:n,e:e};
  }catch(x){return null}
}
function mini(list){
  var W=340,H=64,L=8,R=8,T=8,B=8,w=W-L-R,hh=H-T-B,end=dayStart(Date.now())+DAY,st=end-7*DAY;
  var X=function(t){return L+(t-st)/(end-st)*w},Y=function(v){return T+(100-v)/100*hh};
  var pts=weekPts(list),s="";
  for(var i=0;i<=7;i++){var x=X(st+i*DAY);s+='<line x1="'+x+'" x2="'+x+'" y1="'+T+'" y2="'+(T+hh)+'" stroke="var(--grid)"/>'}
  if(pts.length>1)s+='<polyline fill="none" stroke="var(--muted)" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="'+pts.map(function(p){return X(p.t).toFixed(1)+","+Y(p.v).toFixed(1)}).join(" ")+'"/>';
  pts.forEach(function(p){s+='<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4" fill="'+col(p.v)+'" stroke="var(--fg)" stroke-width="1.5"/>'});
  return '<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Настроение друга за неделю">'+s+'</svg>';
}
function drawFriends(){
  var box=$("friends");box.innerHTML="";
  friends.forEach(function(f,idx){
    var all=f.e.slice().sort(function(a,b){return b.t-a.t}),last=all[0];
    var d=document.createElement("div");d.className="fr";
    var hd=document.createElement("div");hd.className="frh";
    var dot=document.createElement("i");dot.className="dot";dot.style.background=last?col(last.v):"var(--grid)";
    var nm=document.createElement("b");nm.textContent=f.n;
    var sp=document.createElement("span");sp.textContent=last?lab(last.v)+", "+dayName(last.t)+", "+hm(last.t):"пока без записей";
    var x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Удалить друга");
    x.addEventListener("click",function(){friends.splice(idx,1);saveF();drawFriends()});
    hd.appendChild(dot);hd.appendChild(nm);hd.appendChild(sp);hd.appendChild(x);
    d.appendChild(hd);d.insertAdjacentHTML("beforeend",mini(f.e));
    box.appendChild(d);
  });
}
function fmsg(t){$("fmsg").textContent=t}
$("ff").addEventListener("submit",function(ev){
  ev.preventDefault();
  var m=$("fcode").value.replace(/\s+/g,"").match(/MURR1:([A-Za-z0-9+\/=]+)/);
  var o=m&&parseCode(m[1]);
  if(!o){fmsg("Не получилось прочитать код. Скопируй его целиком и вставь ещё раз.");return}
  var k=o.n.toLowerCase(),i=friends.findIndex(function(f){return f.n.toLowerCase()===k});
  if(i>=0){friends[i]=o;fmsg("Обновил настроение: "+o.n)}else{friends.push(o);fmsg("Друг добавлен: "+o.n)}
  saveF();$("fcode").value="";drawFriends();
});
$("share").addEventListener("click",function(){
  if(!nick){fmsg("Сначала введи никнейм вверху.");return}
  var code=makeCode(),ta=$("mycode");
  var p=navigator.share?navigator.share({text:code}):Promise.reject(new Error("no share"));
  p.then(function(){fmsg("Готово. Теперь друг может вставить твой код.")},function(err){
    if(err&&err.name==="AbortError")return;
    var c=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(code):Promise.reject();
    return c.then(function(){fmsg("Код скопирован. Отправь его другу в мессенджере.")},function(){ta.value=code;ta.hidden=false;ta.select();fmsg("Скопируй код вручную и отправь его другу.")});
  });
});
drawFriends();

// home-screen icon: the cat picture on a cream tile
var art=$("cat").querySelector("img");
function tile(n){var c=document.createElement("canvas");c.width=c.height=n;var g=c.getContext("2d");g.fillStyle="#fbf4e2";g.fillRect(0,0,n,n);g.drawImage(art,0,0,n,n);return c.toDataURL("image/png")}
function setIcons(){
  try{
    var a=tile(180),b=tile(192),c=tile(512);
    [["apple-touch-icon",a],["icon",b]].forEach(function(p){var l=document.createElement("link");l.rel=p[0];l.href=p[1];document.head.appendChild(l)});
    var m={name:"Mood chart",short_name:"Mood chart",start_url:location.href.split("#")[0],display:"standalone",background_color:"#fcd873",theme_color:"#fcd873",icons:[{src:b,sizes:"192x192",type:"image/png"},{src:c,sizes:"512x512",type:"image/png"}]};
    var ml=document.createElement("link");ml.rel="manifest";ml.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(m));document.head.appendChild(ml);
  }catch(e){}
}
if(art.complete)setIcons();else art.addEventListener("load",setIcons);
})();
</script>
</body>
</html>
